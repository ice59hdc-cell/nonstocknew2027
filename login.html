<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>เข้าสู่ระบบ · แดชบอร์ดคลังยา รพ.สต. จังหวัดนราธิวาส</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
<main class="login-card" aria-labelledby="lgH">
  <h1 id="lgH">เข้าสู่ระบบ</h1>
  <p class="sub">แดชบอร์ดคลังยา รพ.สต. จังหวัดนราธิวาส</p>
  <form id="lgForm" novalidate>
    <label for="lgPin0" id="lgPinLbl">PIN 5 หลัก</label>
    <div class="pin" role="group" aria-labelledby="lgPinLbl">
      <input id="lgPin0" class="pin-d" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN หลักที่ 1">
      <input class="pin-d" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN หลักที่ 2">
      <input class="pin-d" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN หลักที่ 3">
      <input class="pin-d" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN หลักที่ 4">
      <input class="pin-d" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN หลักที่ 5">
    </div>
    <button type="button" class="btn ghost sm" id="lgShow" aria-pressed="false">แสดง PIN</button>

    <p id="lgErr" class="lg-err" role="alert" hidden></p>
    <button class="btn primary" id="lgGo" type="submit">เข้าสู่ระบบ</button>
  </form>
  <p class="hint">ลืม PIN ให้ติดต่อผู้ดูแลระบบเพื่อตั้ง PIN ใหม่</p>
</main>
<script src="login.js"></script>
</body>
</html>
